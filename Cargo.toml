[workspace]
members = ["crates/lenso-migration", "crates/lenso-migration-d1"]
resolver = "3"

[package]
name = "lenso-postgres-kit"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Plugin-owned PostgreSQL schema lifecycle kit for Lenso applications"
repository = "https://github.com/LioRael/lenso-migration"
readme = "README.md"
keywords = ["lenso", "postgresql", "migration", "plugin"]
categories = ["database"]

[dependencies]
lenso-migration = { version = "0.1.0", path = "crates/lenso-migration" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres"] }
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
