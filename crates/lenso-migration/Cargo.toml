[package]
name = "lenso-migration"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Backend-independent immutable migration plans and history validation for Lenso Plugins"
repository = "https://github.com/LioRael/lenso-migration"
readme = "README.md"
keywords = ["lenso", "migration", "plugin"]
categories = ["database"]

[dependencies]
hex = "0.4"
sha2 = "0.11"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
